kind = "web"
previewPath = "/"
title = "EvidenceArc"
description = "An evidence-first career coach that helps candidates compare resume examples with a target role, practice interview answers, and plan focused preparation."
version = "1.0.0"
id = "artifacts/interviewiq"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26250

[services.development]
run = "pnpm --filter @workspace/interviewiq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/interviewiq", "run", "build" ]
serve = "static"
publicDir = "artifacts/interviewiq/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26250"
BASE_PATH = "/"
